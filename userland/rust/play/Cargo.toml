[package]
name = "play"
description = "Interactive WAV/MP3 player for Anshi"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Linked by scripts/build-userland.sh with userland/link.ld and
# c/mp3.c (minimp3, vendor/minimp3/) -- see ../Cargo.toml.
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anshi.workspace = true
anshi-tui.workspace = true
ratatui.workspace = true
