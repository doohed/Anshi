# Anshi's Rust userland: one Cargo workspace, one lockfile, one target/.
#
#   anshi/   the runtime every program links: _start, the int 0x80
#            syscalls and safe wrappers, the global allocator (on brk),
#            and the panic handler. There is no Rust std for Anshi.
#   tui/     anshi-tui: ratatui on Anshi -- the console backend, plus
#            setup/teardown shared by full-screen programs.
#   sh/      the shell the system boots into, built as a staticlib.
#   play/    the WAV/MP3 player, also a staticlib.
#   scarf/   the vim-style editor with a file sidebar, also a staticlib.
#   tile/    the terminal multiplexer (a VT per pane), also a staticlib.
#   selftest/ the self-test payloads (hello, forktest, ...), one staticlib
#            linked once per test.
#
# Programs are `staticlib`s, not Rust binaries: scripts/build-userland.sh
# links each one (with any C sources of its own) using userland/link.ld.
# anshi's `_start` calls the `main` the program exports. Build from
# anywhere with
#   cargo build --release --manifest-path userland/rust/Cargo.toml \
#       --config userland/rust/.cargo/config.toml
# or plain `cargo build --release` from inside this directory.
[workspace]
members = ["anshi", "tui", "sh", "play", "scarf", "tile", "selftest"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anshi = { path = "anshi" }
anshi-tui = { path = "tui" }
# no_std: the default features pull in std (crossterm, layout cache, ...).
ratatui = { version = "0.30", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
