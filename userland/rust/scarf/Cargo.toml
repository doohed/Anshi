[package]
name = "scarf"
description = "A small vim-style text editor with a file sidebar, for Anshi"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Linked by scripts/build-userland.sh with userland/link.ld -- see
# ../Cargo.toml.
[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
anshi.workspace = true
anshi-tui.workspace = true
ratatui.workspace = true
